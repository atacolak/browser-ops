# xAI Account — Remove
# Delete an xAI auth file from the CPA proxy via management API.
#
# Correct endpoint (current CLIProxyAPI):
#   DELETE /v0/management/auth-files?name=<filename.json>
#   e.g. name=xai-user@host.json  (URL-encode the value)
#
# Wrong (404 on this build — do not use):
#   DELETE /v0/management/auth-files/<filename>
#   path-style id was what metabolism used historically; it always 404'd.
#
# Prefer API remove. Do not docker-exec rm unless the API is confirmed down
# and an operator explicitly chooses filesystem fallback.
name: xai-remove
description: Remove an xAI account auth file from the CPA proxy via management API
domain: cpa-manager
params:
  email:
    description: xAI account email to remove

steps:
  # Resolve auth file name from management list
  - action: evaluate
    expression: |
      (async () => {
        const r = await fetch("/v0/management/auth-files", {
          headers: { "Authorization": "Bearer ${CPA_ADMIN_KEY}" }  # CPA_ADMIN_KEY required
        });
        const data = await r.json();
        const files = data.files || [];
        const target = files.find(f => f.email === "{{email}}" && f.provider === "xai");
        if (!target) return null;
        window.__xai_remove_target = target;
        return JSON.stringify({ name: target.name, status: target.status, id: target.id });
      })()
    store_as: account_info
  - action: verify
    assert: "account_info != None"
    message: "Account should exist before removal"

  # Delete via query-param name (not path-style)
  - action: evaluate
    expression: |
      (async () => {
        const target = window.__xai_remove_target;
        if (!target || !target.name) return "missing-target";
        const url = "/v0/management/auth-files?name=" + encodeURIComponent(target.name);
        const del = await fetch(url, {
          method: "DELETE",
          headers: { "Authorization": "Bearer ${CPA_ADMIN_KEY}" }  # CPA_ADMIN_KEY required
        });
        const text = await del.text();
        let body = text;
        try { body = JSON.parse(text); } catch (_) {}
        window.__xai_remove_result = { status: del.status, body };
        return JSON.stringify(window.__xai_remove_result);
      })()
    store_as: delete_result
  - action: verify
    assert: "delete_result contains '200' or delete_result contains '204' or delete_result contains 'ok'"
    message: "DELETE ?name= should succeed (not path-style 404)"

  # Confirm gone from list
  - action: evaluate
    expression: |
      (async () => {
        const r = await fetch("/v0/management/auth-files", {
          headers: { "Authorization": "Bearer ${CPA_ADMIN_KEY}" }  # CPA_ADMIN_KEY required
        });
        const data = await r.json();
        const files = data.files || [];
        const stillExists = files.some(f => f.email === "{{email}}" && f.provider === "xai");
        return stillExists ? "still-present" : "removed";
      })()
    store_as: removal_status
  - action: verify
    assert: "removal_status == 'removed'"
    message: "Auth file should be gone after removal"
