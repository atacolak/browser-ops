# CPA Manager Plus — Login
# admin_key MUST come from CPA_ADMIN_KEY (no literal defaults).

name: cpa-login
description: Log into CPA Manager Plus dashboard
domain: cpa-manager
params:
  admin_key:
    description: CPA admin key from CPA_ADMIN_KEY env
    required: true
    from_env: CPA_ADMIN_KEY

steps:
  - action: navigate
    url: "http://127.0.0.1:8316/management.html#/login"
  - action: wait_for_load
    timeout: 10
  - action: fill
    selector: 'input[placeholder*="admin key"]'
    text: "{{admin_key}}"
  - action: press
    key: "Enter"
  - action: wait_for_load
    timeout: 10
  - action: evaluate
    expression: 'window.location.href'
    store_as: current_url
  - action: verify
    assert: "current_url != 'login'"
    message: "Should be on dashboard, not login page"
